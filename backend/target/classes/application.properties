# ==============================================================================
# SAMBAR & SPICY — APPLICATION PROPERTIES
# ==============================================================================
spring.application.name=sambar-spicy-backend
server.port=8080
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ------------------------------------------------------------------------------
# MySQL Database Connection (Environment Variables with Safe Fallbacks)
# ------------------------------------------------------------------------------
spring.config.import=optional:file:./.env[.properties]
# Optional public menu and catalog list Redis cache. Billing continues to use MySQL.
app.public-menu-cache.enabled=${PUBLIC_MENU_CACHE_ENABLED:false}
app.public-menu-cache.namespace=${PUBLIC_MENU_CACHE_NAMESPACE:sambar}
# Prepared Spring Cache configuration; no application endpoints use it yet.
app.spring-cache.enabled=${SPRING_CACHE_ENABLED:false}
app.spring-cache.public-menu-ttl=${SPRING_CACHE_PUBLIC_MENU_TTL:30s}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.data.redis.repositories.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sambar_spicy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=SambarSpicyHikariPool

# ------------------------------------------------------------------------------
# Spring Data JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
# Strict validation: Hibernate verifies entities against Flyway-migrated MySQL schema.
# Never allow Hibernate to auto-create, alter, or drop tables in production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ------------------------------------------------------------------------------
# Flyway Migration Configuration
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Image files are compressed in the browser and limited to under 100 KB in storage.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ------------------------------------------------------------------------------
# Jackson Serialization
# ------------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null


# ------------------------------------------------------------------------------
# Demo / Bootstrap Credentials (Development Defaults)
# ------------------------------------------------------------------------------
app.bootstrap.admin.username=admin
app.bootstrap.admin.password=Admin@123
app.bootstrap.cashier.username=cashier
app.bootstrap.cashier.password=Cashier@123
app.bootstrap.viewer.username=viewer
app.bootstrap.viewer.password=Viewer@123
