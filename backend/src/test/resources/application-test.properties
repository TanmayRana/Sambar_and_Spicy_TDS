# ==============================================================================
# SAMBAR & SPICY — TEST PROFILE (test)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
# Tests must opt in explicitly, with their own mock or isolated Redis namespace.
app.public-menu-cache.enabled=false
app.spring-cache.enabled=false
